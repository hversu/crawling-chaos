services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: crawling-chaos-db
    environment:
      POSTGRES_DB: ${DB_NAME:-crawling_chaos}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Bind to localhost only - not accessible from external networks
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crawling-chaos-network

  # Flask API Service
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: crawling-chaos-api
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-crawling_chaos}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      API_PORT: ${API_PORT:-5000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
    volumes:
      - ./api:/app
      - ./interface:/app/interface
    ports:
      # Bind to localhost only - nginx on host will proxy to this
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crawling-chaos-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  crawling-chaos-network:
    driver: bridge
